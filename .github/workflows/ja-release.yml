name: Publish tested AWS release
on:
  push:
    tags: ['v*-ja.*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/ja-release.yml']
permissions:
  contents: read
concurrency:
  group: aws-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: jaworldwideorg/agents
          ref: 7ef2be0eec1c3e510e1771127a0b68b5e16afa01
          path: .ja-agents
      - name: Build pinned agents SDK
        working-directory: .ja-agents
        run: |
          npm ci --no-audit
          npm run build
          printf '*\n!dist\n!dist/**\n!package.json\n' > .dockerignore
      - name: Install locked dependencies and test parser
        run: |
          npm ci --no-audit
          node scripts/ja-sdk.mjs
          python -m pip install pypdf==6.16.1
          cp api/test/.env.test.example api/test/.env.test
      - name: Build release frontend and packages
        run: npm run frontend
      - name: Check changed workspaces and static rules
        run: |
          npm run static-checks -- --against v0.8.8
          (cd packages/api && npx tsc --noEmit)
          (cd packages/data-provider && npx tsc --noEmit)
      - name: Test attachment handoff and session continuity
        working-directory: packages/api
        run: MCP_ATTACHMENT_TEST_PYTHON="$(command -v python)" npx jest src/mcp/files.spec.ts src/agents/files/manifest.spec.ts src/agents/files/host.spec.ts src/agents/files/session.spec.ts src/agents/__tests__/run-codeTools.test.ts --runInBand --coverage=false
      - name: Test legacy host wiring
        working-directory: api
        run: npx jest server/controllers/agents/__tests__/callbacks.spec.js server/services/__tests__/MCP.spec.js app/clients/tools/util/handleTools.test.js --runInBand --coverage=false
      - name: Test configuration contracts and migrations
        run: |
          (cd packages/data-provider && npx jest specs/config-schemas.spec.ts --runInBand --coverage=false)
          npm run test:config -- --runInBand
      - name: Audit dependencies against the accepted upstream baseline
        run: |
          node --test scripts/ja-audit.test.mjs
          npm audit --omit=dev --json > ja-audit.json || test "$?" -eq 1
          node scripts/ja-audit.mjs ja-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ja-dependency-audit
          path: ja-audit.json
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/checkout@v7
        with:
          repository: jaworldwideorg/agents
          ref: 7ef2be0eec1c3e510e1771127a0b68b5e16afa01
          path: .ja-agents
      - name: Prepare existing pinned SDK build
        run: |
          cd .ja-agents
          npm ci --no-audit
          npm run build
          printf '*\n!dist\n!dist/**\n!package.json\n' > .dockerignore
          cd ..
          node scripts/ja-docker.mjs
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::467816190573:role/github-librechat-images
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Validate immutable JA release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ja\.[0-9]+$ ]]
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ja.generated
          build-contexts: agents_sdk=./.ja-agents
          target: api-build
          platforms: linux/amd64
          push: true
          tags: 467816190573.dkr.ecr.eu-central-1.amazonaws.com/oneja/librechat/librechat:${{ github.ref_name }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
